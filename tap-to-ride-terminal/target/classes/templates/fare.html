<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap to Ride - Driver Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 
         * Custom "Vaultix" theme as a Standard Web/Terminal Card
         */
        body {
            /* Smooth dark slate/blue gradient matching the provided image */
            background: radial-gradient(circle at top, #1a2235, #0d111c);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Portrait Web Card (Not a mobile phone) */
        .terminal-card {
            background-color: #0a0c14; 
            border-radius: 16px; /* Standard web card rounding, not phone rounding */
            padding: 50px 40px;
            width: 100%;
            max-width: 480px; /* Slightly wider than a phone, perfect for a portrait widget */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2235; /* Thin standard border, no thick phone bezel */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* The subtle glowing orb */
        .terminal-card::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 184, 255, 0.12) 0%, rgba(10, 12, 20, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .terminal-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .terminal-header h2 {
            font-weight: 800;
            color: #ffffff;
            font-size: 2.5rem;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .text-cyan {
            color: #00e5ff;
        }

        .terminal-header p {
            color: #8f9bb3;
            font-size: 1.05rem;
        }

        .form-control {
            background-color: #121523;
            border: 1px solid #23273b;
            color: #ffffff;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: #161a2b;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .form-control::placeholder {
            color: #9ca3af; /* Much lighter grey for visibility */
            opacity: 1; /* Overrides default browser opacity */
        }

        .form-label {
            color: #e5e7eb;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .btn-tap {
            background: #2563eb;
            border: none;
            border-radius: 12px; /* Standard button rounding instead of pill */
            color: white;
            font-weight: 600;
            font-size: 1.15rem;
            padding: 18px;
            width: 100%;
            margin-top: 40px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .btn-tap:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .queue-status {
            text-align: center;
            font-size: 0.95rem;
            color: #6b7280;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1f2235;
        }

        .queue-count {
            color: #00e5ff;
            font-weight: bold;
        }

        .alert-custom {
            background-color: rgba(32, 191, 107, 0.15);
            border: 1px solid rgba(32, 191, 107, 0.4);
            color: #20bf6b; /* Bright success green */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    
    <!-- Standard Portrait Terminal Widget -->
    <div class="terminal-card">
        <div class="content-wrapper">
            
            <div class="terminal-header">
                <h2>Tap to <span class="text-cyan">Ride.</span></h2>
                <p>Fast, secure transit payments.</p>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert-custom py-3 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span th:text="${successMessage}"></span>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-3 mb-4">
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- The Payment Form -->
            <form action="/tap" method="POST" class="d-flex flex-column">
                
                <div>
                    <label for="riderId" class="form-label mt-0">Rider Card ID</label>
                    <input type="text" class="form-control" id="riderId" name="riderId" 
                           placeholder="Scan or enter card..." required autofocus>
                </div>

                <div>
                    <label for="amount" class="form-label">Fare Amount (ZAR)</label>
                    <input type="text" inputmode="decimal" class="form-control" id="amount" name="amountInput"
                           value="12.00" required pattern="[0-9]+\.[0-9]{2}"
                           title="Enter a valid amount"
                           oninvalid="this.setCustomValidity('Enter a valid amount')"
                           oninput="this.setCustomValidity('')">
                    <small class="text-secondary">Example: 12.00</small>
                </div>
                <!-- when you press submit, the amount and riderId are packaged together and a POST request is sent to the /tap url -->
                <button type="submit" class="btn-tap">Process Payment</button>
            </form>

            <!-- Queue Status -->
            <div class="queue-status">
                Trips waiting for sync: <span class="queue-count" th:text="${queuedCount != null ? queuedCount : 0}">0</span>
            </div>

        </div>
    </div>

</div>

<script>
    // Poll the server every 3 seconds to update the queue count dynamically
    setInterval(() => {
        fetch('/api/queue-count')
            .then(response => response.text())
            .then(count => {
                const badge = document.querySelector('.queue-count');
                if (badge) {
                    badge.innerText = count;
                }
            })
            .catch(err => console.error("Could not fetch queue count", err));
    }, 3000);
</script>

</body>
</html>
