<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headquarters Console | Tap to Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 
         * HQ Dashboard Dark Theme
         */
        body {
            /* Smooth dark slate/blue gradient matching the Terminal UI */
            background: radial-gradient(circle at top, #1a2235, #0d111c);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .navbar-custom {
            background-color: #0a0c14;
            border-bottom: 1px solid #1f2235;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar-brand {
            color: #ffffff;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .text-cyan { color: #00e5ff; }
        .text-blue { color: #2563eb; }

        /* Dashboard Container */
        .dashboard-container {
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Stat Cards */
        .stat-card {
            background-color: #0a0c14;
            border: 1px solid #1f2235;
            border-radius: 20px;
            padding: 30px;
            height: 100%;
            transition: transform 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #2563eb;
        }

        /* Subtle glow in the corner of cards */
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
        }

        .stat-card h3 {
            color: #8f9bb3;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
        }

        /* Settlement Action Card */
        .action-card {
            background: linear-gradient(135deg, #0a0c14 0%, #0d111c 100%);
            border: 1px solid #1f2235;
            border-radius: 24px;
            padding: 50px;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .action-content h2 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .action-content p {
            color: #8f9bb3;
            font-size: 1.1rem;
            margin-bottom: 0;
            max-width: 500px;
        }

        /* Main Action Button */
        .btn-settle {
            background: #2563eb;
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 20px 40px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
            white-space: nowrap;
        }

        .btn-settle:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4);
        }

        /* Success Alert */
        .alert-custom {
            background-color: rgba(32, 191, 107, 0.15);
            border: 1px solid rgba(32, 191, 107, 0.4);
            color: #20bf6b;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            font-size: 1.1rem;
        }

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="navbar-custom">
        <div class="navbar-brand">
            Tap to <span class="text-cyan">Ride.</span>
        </div>
    </nav>

    <!-- Main Dashboard -->
    <div class="dashboard-container">
        
        <!-- Success Alert from /settle redirect -->
        <div th:if="${successMessage}" class="alert-custom mb-5">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- KPI Stat Cards -->
        <div class="row g-4">
            <!-- Stat 1 -->
            <div class="col-md-4">
                <div class="stat-card">
                    <h3>Total Trips Received</h3>
                    <!-- Uses 0 if the variable is missing -->
                    <div class="stat-number" th:text="${totalTrips ?: 0}">0</div>
                </div>
            </div>
            
            <!-- Stat 2 -->
            <div class="col-md-4">
                <div class="stat-card">
                    <h3>Pending Settlement</h3>
                    <div class="stat-number text-cyan" th:text="${unsettledTrips ?: 0}">0</div>
                </div>
            </div>

            <!-- Stat 3 -->
            <div class="col-md-4">
                <div class="stat-card">
                    <h3>Processed Charges</h3>
                    <div class="stat-number text-blue" th:text="${settledCharges ?: 0}">0</div>
                </div>
            </div>
        </div>

        <!-- The Settlement Engine Section -->
        <div class="action-card">
            <div class="action-content">
                <h2>Daily Settlement Engine</h2>
                <p>Compile all pending trips, aggregate totals by rider, and generate the final billing records for the payment gateway.</p>
            </div>
            
            <!-- This form posts to the controller we talked about! -->
            <form action="/settle" method="POST" class="m-0">
                <button type="submit" class="btn-settle">Run Settlement Now</button>
            </form>
        </div>

    </div>

</body>
</html>
